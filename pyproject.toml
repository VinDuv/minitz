[tool.mypy]
strict = "yes"

[tool.pylint.MAIN]
persistent = "no"
score = "no"

[tool.coverage.run]
branch = true
command_line = "-m unittest"
data_file = "coverage/data.sqlite3"
omit = [
	"tests*"
]

[tool.coverage.report]
exclude_also = [
	"def __repr__",
	"raise AssertionError",
    "raise NotImplementedError",
    "except ImportError"
]
